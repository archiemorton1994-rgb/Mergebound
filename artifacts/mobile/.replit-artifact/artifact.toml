kind = "mobile"
previewPath = "/"
title = "Creature Merge RPG"
description = "A mobile creature-merging RPG vertical slice: hatch eggs into tier-0 creatures, merge two creatures using deterministic rules, and keep the result in a locally persisted collection. Built with Expo + TypeScript, game logic fully separated from UI."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/"
